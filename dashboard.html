<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediAlert - Shop Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-xl mx-auto space-y-6">
        <!-- Auth Card -->
        <div id="authCard" class="bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-xl font-bold mb-4 text-blue-600">MediAlert - Shop Login / Signup</h1>
            <div class="space-y-3">
                <input type="email" id="email" placeholder="Shop Email" class="w-full p-2 border rounded">
                <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded">
                <div class="flex space-x-2">
                    <button onclick="signUp()" class="w-1/2 bg-gray-600 text-white p-2 rounded font-semibold hover:bg-gray-700">Register</button>
                    <button onclick="signIn()" class="w-1/2 bg-blue-600 text-white p-2 rounded font-semibold hover:bg-blue-700">Login</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Panel (Hidden until login) -->
        <div id="dashCard" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
                <span id="userEmail" class="font-semibold text-gray-700"></span>
                <button onclick="signOut()" class="bg-red-500 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-red-600">Logout</button>
            </div>

            <!-- Add Medicine Form -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-bold mb-4 text-blue-600">Add Medicine</h2>
                <div class="space-y-3">
                    <input type="text" id="medName" placeholder="Medicine Name" class="w-full p-2 border rounded">
                    <input type="date" id="expiryDate" class="w-full p-2 border rounded">
                    <input type="text" id="phone" placeholder="Owner Phone Number" class="w-full p-2 border rounded">
                    <button onclick="saveMedicine()" class="w-full bg-blue-600 text-white p-2 rounded font-semibold hover:bg-blue-700">Save Medicine</button>
                </div>
            </div>

            <!-- Expiry Alert View -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-semibold mb-3 text-red-600">Expiring Soon (Your Shop)</h2>
                <div id="alertList" class="space-y-2 text-sm text-gray-700">
                    <p class="text-gray-500">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://uxexvihnvokpllpwdxzj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_0HQKMAZc76sIrOgvS9fBVA_KSkjxMo-";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('authCard').classList.add('hidden');
                document.getElementById('dashCard').classList.remove('hidden');
                document.getElementById('userEmail').innerText = `Logged in as: ${session.user.email}`;
                loadExpiringMedicines();
            } else {
                document.getElementById('authCard').classList.remove('hidden');
                document.getElementById('dashCard').classList.add('hidden');
            }
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
            else alert('Registration successful! You can now log in.');
        }

        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else checkUser();
        }

        async function signOut() {
            await supabase.auth.signOut();
            checkUser();
        }

        async function loadExpiringMedicines() {
            const { data, error } = await supabase.from('vw_expiring_soon').select('*');
            const container = document.getElementById('alertList');
            container.innerHTML = '';

            if (error) {
                container.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-green-600">No medicines expiring soon!</p>`;
                return;
            }

            data.forEach(item => {
                container.innerHTML += `
                    <div class="p-3 bg-red-50 border border-red-200 rounded flex justify-between items-center">
                        <div>
                            <p class="font-bold text-red-800">${item.medicine_name}</p>
                            <p class="text-xs text-gray-500">Expiry: ${item.expiry_date}</p>
                        </div>
                        <span class="bg-red-200 text-red-800 text-xs px-2 py-1 rounded font-bold">${item.days_left} days left</span>
                    </div>
                `;
            });
        }

        async function saveMedicine() {
            const medicine_name = document.getElementById('medName').value;
            const expiry_date = document.getElementById('expiryDate').value;
            const phone_number = document.getElementById('phone').value;
            
            const { data: { session } } = await supabase.auth.getSession();
            const shop_id = session.user.id; // Automatically binds to logged-in user UUID

            if (!medicine_name || !expiry_date) {
                alert('Please fill in required fields.');
                return;
            }

            const { error } = await supabase
                .from('medicines')
                .insert([{ medicine_name, expiry_date, phone_number, shop_id }]);

            if (error) {
                alert('Error saving: ' + error.message);
            } else {
                alert('Saved successfully!');
                document.getElementById('medName').value = '';
                document.getElementById('expiryDate').value = '';
                document.getElementById('phone').value = '';
                loadExpiringMedicines();
            }
        }

        checkUser();
    </script>
</body>
</html>
